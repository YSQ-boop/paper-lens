name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: skills/paper-lens/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r skills/paper-lens/requirements.txt
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q skills evals tests
      - name: Check shell syntax
        run: bash -n skills/paper-lens/scripts/bootstrap.sh
      - name: Check CLI version
        run: python skills/paper-lens/scripts/paper_pipeline.py --version
